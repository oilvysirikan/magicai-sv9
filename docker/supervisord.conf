[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:octane]
process_name=%(program_name)s
command=sh -c "php /app/artisan octane:start --server=swoole --host=0.0.0.0 --port=${PORT:-8000}"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:queue]
process_name=%(program_name)s
command=/usr/local/bin/start-queue.sh
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
