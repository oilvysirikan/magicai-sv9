[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "app"
protocol = "http"

[services.env]
APP_ENV = "production"
APP_DEBUG = "false"
LOG_CHANNEL = "stack"
LOG_LEVEL = "warning"
CACHE_DRIVER = "redis"
SESSION_DRIVER = "redis"
QUEUE_CONNECTION = "redis"
FILESYSTEM_DISK = "r2"

[[services.ports]]
port = 8080
forceHttps = true

[[services.tcp_checks]]
gracePeriodSeconds = 10
intervalSeconds = 10
timeoutSeconds = 5
